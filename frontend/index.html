<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ============================
          FAVICONS (Google Friendly)
    ============================= -->

    <!-- Main Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- ICO Fallback -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================
          PRIMARY META TAGS
    ============================= -->
    <title>SurveyZen — Create Beautiful Surveys in Minutes</title>
    <meta name="title" content="SurveyZen — Create Beautiful Surveys in Minutes" />
    <meta
      name="description"
      content="SurveyZen is a clean, intuitive survey builder that helps teams, educators, and businesses create beautiful surveys with real-time analytics. Free to start — no credit card required."
    />
    <meta
      name="keywords"
      content="survey maker, free survey tool, create survey, online survey creator, survey builder, feedback tool, analytics, forms, SurveyZen"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://surveyzen.live" />

    <!-- ============================
          OPEN GRAPH (Facebook, etc.)
    ============================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://surveyzen.live/" />
    <meta
      property="og:title"
      content="SurveyZen — Create Beautiful Surveys in Minutes"
    />
    <meta
      property="og:description"
      content="Build surveys effortlessly with SurveyZen. Share instantly and analyze responses with beautiful, real-time dashboards."
    />
    <meta property="og:image" content="https://surveyzen.live/og-image.png" />
    <meta property="og:site_name" content="SurveyZen" />

    <!-- ============================
            TWITTER META TAGS
    ============================= -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://surveyzen.live/" />
    <meta
      property="twitter:title"
      content="SurveyZen — Create Beautiful Surveys in Minutes"
    />
    <meta
      property="twitter:description"
      content="Build surveys effortlessly with SurveyZen. Share instantly and analyze responses with beautiful, real-time dashboards."
    />
    <meta
      property="twitter:image"
      content="https://surveyzen.live/og-image.png"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4f46e5" />


    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
