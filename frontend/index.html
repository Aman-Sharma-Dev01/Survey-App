    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is SurveyZen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SurveyZen is an AI-powered survey and quiz builder that helps teams, educators, and businesses create beautiful surveys and quizzes with real-time analytics, anti-cheat protection, and automatic certificate generation."
          }
        },
        {
          "@type": "Question",
          "name": "Is SurveyZen free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! SurveyZen offers a free forever plan with unlimited surveys and quizzes, real-time analytics, and 100 AI credits per month. No credit card required to get started."
          }
        },
        {
          "@type": "Question",
          "name": "Can I create quizzes with SurveyZen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! SurveyZen supports quiz creation with automatic scoring, time limits, multiple choice questions, anti-cheat features (tab-switch detection, fullscreen mode), and automatic certificate generation with QR code verification."
          }
        },
        {
          "@type": "Question",
          "name": "How do I share my survey or quiz?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After creating your survey or quiz, you get a unique shareable link that you can send via email, social media, or embed on your website. Quizzes can also be scheduled with specific start and end times."
          }
        },
        {
          "@type": "Question",
          "name": "What are the anti-cheat features in quizzes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SurveyZen offers robust anti-cheat features including tab-switch detection (auto-submit after 3 switches), fullscreen enforcement (auto-submit after 3 exits), question/option randomization, time limits, and duplicate roll number prevention."
          }
        },
        {
          "@type": "Question",
          "name": "Can I generate certificates for quiz takers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! SurveyZen automatically generates beautiful, verifiable certificates with QR codes for quiz completers who pass the minimum score threshold. Certificates can be verified online."
          }
        },
        {
          "@type": "Question",
          "name": "Does SurveyZen support AI features?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! SurveyZen uses AI to help you generate survey and quiz questions automatically based on your topic. Simply describe what you need, and our AI will suggest relevant questions."
          }
        },
        {
          "@type": "Question",
          "name": "Can I add images to questions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Both surveys and quizzes support image uploads. You can add images to questions and answer options, making it perfect for visual quizzes, diagrams, and charts."
          }
        }
      ]
    }
    </script>
